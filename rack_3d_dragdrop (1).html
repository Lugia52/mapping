<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rack 3D — Drag & Drop</title>
<style>
  :root{
    --bg:#0a0e12; --panel:#10161c; --line:#1f2b34;
    --accent:#3ddc97; --accent2:#4ea8de; --warn:#e8a33d; --danger:#e85d5d;
    --text:#d7e2e9; --muted:#6b8494;
    --mono:'JetBrains Mono','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden;}
  #scene{position:absolute;inset:0;}

  #hud{position:absolute; top:0; left:0; right:0; padding:16px 20px; display:flex; justify-content:space-between; pointer-events:none;}
  #hud .title{font-size:13px; letter-spacing:2px; color:var(--muted); text-transform:uppercase;}
  #hud .title b{color:var(--accent); font-weight:600;}
  #hud .sub{font-size:11px; color:var(--muted); margin-top:4px;}

  /* left palette — device library */
  #palette{
    position:absolute; top:70px; left:16px; width:220px;
    background:rgba(12,17,22,0.92); border:1px solid var(--line); border-radius:8px;
    padding:12px; backdrop-filter:blur(8px); pointer-events:auto;
    max-height:calc(100% - 160px); overflow-y:auto;
  }
  #palette h3{font-size:10px; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; margin:0 0 10px;}
  .lib-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:6px;
    cursor:grab; transition:border-color .15s, transform .1s;
  }
  .lib-item:hover{border-color:var(--accent2);}
  .lib-item:active{cursor:grabbing; transform:scale(0.98);}
  .lib-item .swatch{width:10px; height:22px; border-radius:2px; flex:none;}
  .lib-item .info{flex:1; min-width:0;}
  .lib-item .info .n{font-size:11px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lib-item .info .u{font-size:9px; color:var(--muted);}

  #dragghost{
    position:absolute; pointer-events:none; z-index:50; display:none;
    padding:6px 10px; background:rgba(61,220,151,0.15); border:1px solid var(--accent);
    border-radius:4px; font-size:11px; color:var(--accent); transform:translate(-50%,-140%);
  }

  #panel{
    position:absolute; top:0; right:0; height:100%; width:290px;
    background:rgba(12,17,22,0.92); border-left:1px solid var(--line);
    padding:70px 18px 18px; transform:translateX(100%);
    transition:transform .25s ease; backdrop-filter:blur(8px);
  }
  #panel.open{transform:translateX(0);}
  #panel h2{font-size:14px; color:var(--accent); margin:0 0 4px; letter-spacing:1px;}
  #panel .model{font-size:11px; color:var(--muted); margin-bottom:16px;}
  #panel .field{margin-bottom:12px;}
  #panel .field label{display:block; font-size:9px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:3px;}
  #panel .field .val{font-size:12px; color:var(--text);}
  #panel .close{position:absolute; top:18px; right:18px; cursor:pointer; color:var(--muted); font-size:18px; pointer-events:auto; background:none; border:none;}
  #panel .danger-btn{
    margin-top:10px; width:100%; padding:8px; background:rgba(232,93,93,0.1); border:1px solid var(--danger);
    color:var(--danger); border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer;
  }
  #panel .danger-btn:hover{background:rgba(232,93,93,0.2);}

  #footer{
    position:absolute; bottom:0; left:0; right:0; padding:12px 20px;
    display:flex; justify-content:space-between; align-items:center;
    font-size:10px; color:var(--muted); pointer-events:none; letter-spacing:.5px;
  }
  #hint{background:rgba(16,22,28,0.7); padding:6px 10px; border-radius:4px; border:1px solid var(--line);}
  #toast{
    position:absolute; bottom:50px; left:50%; transform:translateX(-50%);
    background:rgba(232,93,93,0.15); border:1px solid var(--danger); color:var(--danger);
    padding:8px 16px; border-radius:6px; font-size:11px; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  #toast.show{opacity:1;}
  #toast.ok{background:rgba(61,220,151,0.15); border-color:var(--accent); color:var(--accent);}
</style>
</head>
<body>
<div id="scene"></div>

<div id="hud">
  <div>
    <div class="title">RACK VIEW · <b>nmswifi</b></div>
    <div class="sub">Drag device dari panel kiri ke slot rack</div>
  </div>
</div>

<div id="palette">
  <h3>Device Library</h3>
  <div id="lib-list"></div>
</div>

<div id="dragghost"></div>
<div id="toast"></div>

<div id="footer">
  <div id="hint">🖱 Drag: putar &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Klik device: detail &nbsp;|&nbsp; Del: hapus device terpilih</div>
  <div id="fps">— fps</div>
</div>

<div id="panel">
  <button class="close" onclick="closePanel()">✕</button>
  <h2 id="p-name">—</h2>
  <div class="model" id="p-model">—</div>
  <div class="field"><label>Posisi Rack</label><div class="val" id="p-pos">—</div></div>
  <div class="field"><label>Tinggi</label><div class="val" id="p-height">—</div></div>
  <button class="danger-btn" id="removeBtn">Hapus dari Rack</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script>
/* ============================================================
   CONFIG
============================================================ */
const RACK_U = 20;
const U_HEIGHT = 0.32;
const RACK_WIDTH = 3.6;
const RACK_DEPTH = 2.2;

// device library — template katalog, belum ditempatkan di rack
const library = [
  { type:"dell-r740", name:"Dell PowerEdge R740", heightU:2, color:0x1e2b33 },
  { type:"dell-r640", name:"Dell PowerEdge R640", heightU:1, color:0x1e2b33 },
  { type:"cisco-9300", name:"Cisco Catalyst 9300", heightU:1, color:0x2b3a44 },
  { type:"patch-panel", name:"Patch Panel 24-port", heightU:1, color:0x233038 },
  { type:"ups", name:"APC Smart-UPS", heightU:2, color:0x2a2620 },
  { type:"blank", name:"Blank Panel", heightU:1, color:0x161c21 },
];

// state: device yang sudah dipasang di rack
// { id, type, name, heightU, color, startU }
let placed = [];
let idCounter = 1;

/* ============================================================
   RENDER PALETTE
============================================================ */
const libList = document.getElementById('lib-list');
library.forEach(item=>{
  const el = document.createElement('div');
  el.className = 'lib-item';
  el.draggable = true;
  el.innerHTML = `
    <div class="swatch" style="background:#${item.color.toString(16).padStart(6,'0')}"></div>
    <div class="info"><div class="n">${item.name}</div><div class="u">${item.heightU}U</div></div>
  `;
  el.addEventListener('dragstart', (e)=>{
    e.dataTransfer.setData('text/plain', item.type);
    draggingTemplate = item;
  });
  libList.appendChild(el);
});

let draggingTemplate = null;

/* ============================================================
   THREE.JS SETUP
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e12);
scene.fog = new THREE.Fog(0x0a0e12, 10, 26);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6, 4, 7);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
document.getElementById('scene').appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI*0.53;
controls.target.set(0, RACK_U*U_HEIGHT/2, 0);

scene.add(new THREE.AmbientLight(0x22303a, 1.4));
const key = new THREE.DirectionalLight(0x9fd8ff, 0.9);
key.position.set(5,8,4);
scene.add(key);
const rim = new THREE.PointLight(0x3ddc97, 0.6, 15);
rim.position.set(-3, 4, -3);
scene.add(rim);

const grid = new THREE.GridHelper(20, 40, 0x1f2b34, 0x141c22);
scene.add(grid);

const rackGroup = new THREE.Group();
scene.add(rackGroup);

const frameMat = new THREE.MeshStandardMaterial({ color:0x14191e, metalness:0.6, roughness:0.5 });
const rackHeight = RACK_U * U_HEIGHT;

[-RACK_WIDTH/2, RACK_WIDTH/2].forEach(x=>{
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.06, rackHeight, RACK_DEPTH), frameMat);
  rail.position.set(x, rackHeight/2, 0);
  rackGroup.add(rail);
});
[0, rackHeight].forEach(y=>{
  const bar = new THREE.Mesh(new THREE.BoxGeometry(RACK_WIDTH, 0.06, RACK_DEPTH), frameMat);
  bar.position.set(0, y, 0);
  rackGroup.add(bar);
});
const back = new THREE.Mesh(
  new THREE.PlaneGeometry(RACK_WIDTH, rackHeight),
  new THREE.MeshStandardMaterial({ color:0x0c1116, roughness:0.9, side:THREE.DoubleSide })
);
back.position.set(0, rackHeight/2, -RACK_DEPTH/2);
rackGroup.add(back);

// U slot highlight guides (invisible planes used for raycasting drop target + visual ticks)
const slotGuides = [];
for(let u=1; u<=RACK_U; u++){
  const y = (u-0.5)*U_HEIGHT;
  const guide = new THREE.Mesh(
    new THREE.PlaneGeometry(RACK_WIDTH-0.14, U_HEIGHT),
    new THREE.MeshBasicMaterial({ color:0x3ddc97, transparent:true, opacity:0, side:THREE.DoubleSide })
  );
  guide.position.set(0, y, RACK_DEPTH/2 - 0.05);
  guide.userData.slotU = u; // top of the U this plane represents
  rackGroup.add(guide);
  slotGuides.push(guide);

  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.01,0.01), new THREE.MeshBasicMaterial({color:0x2a3944}));
  tick.position.set(-RACK_WIDTH/2-0.02, u*U_HEIGHT, RACK_DEPTH/2);
  rackGroup.add(tick);
}

/* ============================================================
   DEVICE MESH MANAGEMENT
============================================================ */
const deviceMeshGroups = {}; // id -> THREE.Group

function uToY(startU, heightU){ return (startU - heightU) * U_HEIGHT; }

function isSlotFree(startU, heightU, excludeId){
  const endU = startU - heightU; // occupies (endU, startU]
  for(const d of placed){
    if(d.id === excludeId) continue;
    const dEnd = d.startU - d.heightU;
    const overlap = !(startU <= dEnd || endU >= d.startU);
    if(overlap) return false;
  }
  return startU <= RACK_U && endU >= 0;
}

function addLabel(group, text, y, z, width){
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = '600 30px monospace';
  ctx.fillStyle = '#c9d8e0';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 10, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
  sprite.scale.set(1.3, 0.16, 1);
  sprite.position.set(-width/4, 0.03, z);
  group.userData.label = sprite;
  group.add(sprite);
}

function renderDevice(dev){
  const h = dev.heightU * U_HEIGHT - 0.02;
  const w = RACK_WIDTH - 0.14;
  const d = RACK_DEPTH - 0.1;

  const group = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: dev.color, metalness:0.55, roughness:0.4 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
  body.userData.id = dev.id;
  group.add(body);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),
    new THREE.LineBasicMaterial({ color:0x000000, transparent:true, opacity:0.35 })
  );
  group.add(edges);

  addLabel(group, dev.name.toUpperCase(), 0, d/2+0.015, w);

  const y = uToY(dev.startU, dev.heightU) + h/2;
  group.position.set(0, y, 0);
  rackGroup.add(group);
  deviceMeshGroups[dev.id] = group;
  return group;
}

function removeDevice(id){
  const g = deviceMeshGroups[id];
  if(g){ rackGroup.remove(g); delete deviceMeshGroups[id]; }
  placed = placed.filter(d=>d.id!==id);
}

function refreshDevice(dev){
  removeDevice(dev.id);
  renderDevice(dev);
}

/* ============================================================
   DRAG & DROP FROM PALETTE -> RACK (using screen coords + raycaster)
============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const ghostEl = document.getElementById('dragghost');
let previewSlot = null; // currently highlighted target U
let previewValid = false;

renderer.domElement.addEventListener('dragover', (e)=>{
  e.preventDefault();
  if(!draggingTemplate) return;

  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(slotGuides);

  clearSlotHighlights();
  if(hits.length){
    const topU = hits[0].object.userData.slotU;
    const startU = Math.min(RACK_U, topU + draggingTemplate.heightU - 1);
    const valid = isSlotFree(startU, draggingTemplate.heightU, null);
    previewSlot = startU;
    previewValid = valid;
    highlightSlots(startU, draggingTemplate.heightU, valid);

    ghostEl.style.display = 'block';
    ghostEl.style.left = e.clientX + 'px';
    ghostEl.style.top = e.clientY + 'px';
    ghostEl.style.borderColor = valid ? '#3ddc97' : '#e85d5d';
    ghostEl.style.color = valid ? '#3ddc97' : '#e85d5d';
    ghostEl.textContent = `${draggingTemplate.name} → U${startU-draggingTemplate.heightU+1}–U${startU}` + (valid ? '' : ' (bentrok)');
  } else {
    ghostEl.style.display = 'none';
    previewSlot = null;
  }
});

renderer.domElement.addEventListener('dragleave', ()=>{
  ghostEl.style.display = 'none';
  clearSlotHighlights();
});

renderer.domElement.addEventListener('drop', (e)=>{
  e.preventDefault();
  ghostEl.style.display = 'none';
  clearSlotHighlights();
  if(!draggingTemplate || previewSlot===null){ draggingTemplate=null; return; }

  if(!previewValid){
    showToast('Slot bentrok dengan device lain', false);
    draggingTemplate = null;
    return;
  }

  const dev = {
    id: 'dev-'+(idCounter++),
    type: draggingTemplate.type,
    name: draggingTemplate.name,
    heightU: draggingTemplate.heightU,
    color: draggingTemplate.color,
    startU: previewSlot
  };
  placed.push(dev);
  renderDevice(dev);
  showToast(`${dev.name} dipasang di U${dev.startU-dev.heightU+1}`, true);
  draggingTemplate = null;
});

function highlightSlots(startU, heightU, valid){
  const endU = startU - heightU;
  slotGuides.forEach(g=>{
    const u = g.userData.slotU;
    if(u > endU && u <= startU){
      g.material.opacity = 0.35;
      g.material.color.set(valid ? 0x3ddc97 : 0xe85d5d);
    }
  });
}
function clearSlotHighlights(){
  slotGuides.forEach(g=> g.material.opacity = 0 );
}

function showToast(msg, ok){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (ok ? ' ok' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.className = '', 1800);
}

/* ============================================================
   SELECT / DETAIL PANEL / DELETE
============================================================ */
let selectedId = null;

renderer.domElement.addEventListener('click', (e)=>{
  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouse, camera);
  const meshes = Object.values(deviceMeshGroups).map(g=>g.children[0]);
  const hits = raycaster.intersectObjects(meshes);
  if(hits.length){
    selectedId = hits[0].object.userData.id;
    openPanel(selectedId);
  }
});

function openPanel(id){
  const dev = placed.find(d=>d.id===id);
  if(!dev) return;
  document.getElementById('p-name').textContent = dev.name;
  document.getElementById('p-model').textContent = dev.type;
  document.getElementById('p-pos').textContent = `U${dev.startU-dev.heightU+1}–U${dev.startU}`;
  document.getElementById('p-height').textContent = dev.heightU + 'U';
  document.getElementById('panel').classList.add('open');
}
function closePanel(){ document.getElementById('panel').classList.remove('open'); selectedId=null; }

document.getElementById('removeBtn').addEventListener('click', ()=>{
  if(selectedId){
    removeDevice(selectedId);
    showToast('Device dihapus', true);
    closePanel();
  }
});

window.addEventListener('keydown', (e)=>{
  if(e.key==='Delete' && selectedId){
    removeDevice(selectedId);
    showToast('Device dihapus', true);
    closePanel();
  }
});

/* ============================================================
   RESIZE + LOOP
============================================================ */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let lastT = performance.now(), frames=0;
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if(now-lastT>500){
    document.getElementById('fps').textContent = Math.round(frames*1000/(now-lastT))+' fps';
    frames=0; lastT=now;
  }
}
animate();

// seed a couple of starting devices so the rack isn't empty
[{type:"cisco-9300",startU:20},{type:"dell-r740",startU:17}].forEach(seed=>{
  const tmpl = library.find(l=>l.type===seed.type);
  const dev = { id:'dev-'+(idCounter++), type:tmpl.type, name:tmpl.name, heightU:tmpl.heightU, color:tmpl.color, startU:seed.startU };
  placed.push(dev);
  renderDevice(dev);
});
</script>
</body>
</html>
